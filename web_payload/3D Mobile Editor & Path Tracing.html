    <!-- Application Script -->
    <script>
        // Global Variables
        let scene, camera, renderer, orbitControls, transformControls;
        let selectedObject = null;
        let objects = [];
        let lights = [];
        
        // Render Mode State
        let isPathTracing = false;
        let ptSamples = 0;
        let maxPtSamples = 500;

        // Path Tracing Engine Variables (Ping-Pong Accumulation & Real GLSL Raytracer)
        let ptScene, ptCamera, ptMaterial, ptQuad;
        let rtTargetA, rtTargetB;
        let renderTargetSource, renderTargetDest;

        // Initialize App on Load
        window.onload = function () {
            initScene();
            initDefaultLighting();
            initPathTracingEngine();
            animate();
        };

        // Initialize Three.js Scene & Controls
        function initScene() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2.5, 5);

            // 3. WebGL2 Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            // 4. Orbit Controls (Mobile Optimized)
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.maxPolarAngle = Math.PI / 2 + 0.05;
            orbitControls.addEventListener('change', () => {
                if (isPathTracing) resetPathTracing();
            });

            // 5. Transform Gizmo Controls
            transformControls = new THREE.TransformControls(camera, renderer.domElement);
            transformControls.size = 0.75;
            transformControls.addEventListener('change', () => {
                if (isPathTracing) resetPathTracing();
            });
            transformControls.addEventListener('dragging-changed', (event) => {
                orbitControls.enabled = !event.value;
            });
            scene.add(transformControls);

            // 6. Floor Grid Helper
            const gridHelper = new THREE.GridHelper(20, 20, 0x6366f1, 0x334155);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            // Add Ground Plane for Shadows
            const planeGeo = new THREE.PlaneGeometry(20, 20);
            const planeMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.2 });
            const ground = new THREE.Mesh(planeGeo, planeMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            ground.userData.isGround = true;
            scene.add(ground);

            // Add Initial Demo Object
            addPrimitive('box', [0, 0.5, 0]);

            // Raycasting for Touch Selection
            setupRaycaster();

            // Resize Event Listener
            window.addEventListener('resize', onWindowResize);
        }

        // Default Lighting Setup
        function initDefaultLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.5);
            dirLight.position.set(4, 6, 4);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.bias = -0.0001;
            scene.add(dirLight);
            lights.push(dirLight);

            const dirHelper = new THREE.DirectionalLightHelper(dirLight, 0.5, 0xf59e0b);
            dirLight.userData.helper = dirHelper;
            scene.add(dirHelper);
        }

        // --- REAL GPU PATH TRACING ENGINE (GLSL RAY TRACER) ---
        function initPathTracingEngine() {
            ptScene = new THREE.Scene();
            ptCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            const pars = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, type: THREE.FloatType };
            rtTargetA = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, pars);
            rtTargetB = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, pars);
            renderTargetSource = rtTargetA;
            renderTargetDest = rtTargetB;

            // Full GPU Monte Carlo Path Tracing Shader
            ptMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uPreviousTexture: { value: null },
                    uSampleCount: { value: 0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uCameraPos: { value: new THREE.Vector3() },
                    uCameraMat: { value: new THREE.Matrix4() },
                    uLightPos: { value: new THREE.Vector3(4, 6, 4) },
                    uLightColor: { value: new THREE.Color(1, 0.95, 0.9) },
                    uObjPos: { value: new THREE.Vector3(0, 0.5, 0) },
                    uObjColor: { value: new THREE.Color(0.38, 0.4, 0.94) },
                    uObjRoughness: { value: 0.3 },
                    uObjMetalness: { value: 0.1 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uPreviousTexture;
                    uniform float uSampleCount;
                    uniform vec2 uResolution;
                    uniform vec3 uCameraPos;
                    uniform mat4 uCameraMat;
                    uniform vec3 uLightPos;
                    uniform vec3 uLightColor;
                    uniform vec3 uObjPos;
                    uniform vec3 uObjColor;
                    uniform float uObjRoughness;
                    uniform float uObjMetalness;
                    varying vec2 vUv;

                    // Pseudo Random Number Generator for GPU
                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(12.9898, 78.233) + uSampleCount)) * 43758.5453);
                    }

                    // Sphere Intersection
                    float sdSphere(vec3 p, float r) { return length(p) - r; }

                    // Box Intersection
                    float sdBox(vec3 p, vec3 b) {
                        vec3 q = abs(p) - b;
                        return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0);
                    }

                    // Scene SDF Distance
                    float map(vec3 p, out int matId) {
                        float dGround = p.y; // Floor plane at y=0
                        float dObj = sdBox(p - uObjPos, vec3(0.5)); // Main Selected Object

                        if (dGround < dObj) {
                            matId = 0; // Ground
                            return dGround;
                        } else {
                            matId = 1; // Object
                            return dObj;
                        }
                    }

                    // Calculate Normal Vector
                    vec3 calcNormal(vec3 p) {
                        int dummy;
                        vec2 e = vec2(0.001, 0.0);
                        return normalize(vec3(
                            map(p + e.xyy, dummy) - map(p - e.xyy, dummy),
                            map(p + e.yxy, dummy) - map(p - e.yxy, dummy),
                            map(p + e.yyx, dummy) - map(p - e.yyx, dummy)
                        ));
                    }

                    // GPU Path Tracing Core Loop
                    vec3 traceRay(vec3 ro, vec3 rd, vec2 seed) {
                        vec3 rayColor = vec3(1.0);
                        vec3 accumulatedLight = vec3(0.0);

                        for(int bounce = 0; bounce < 3; bounce++) {
                            float t = 0.0;
                            int matId = -1;
                            bool hit = false;

                            // Raymarching to find intersection
                            for(int i = 0; i < 64; i++) {
                                vec3 p = ro + rd * t;
                                float d = map(p, matId);
                                if(d < 0.001) { hit = true; break; }
                                t += d;
                                if(t > 30.0) break;
                            }

                            if(!hit) {
                                // Environment / Sky Light Gradient
                                vec3 skyColor = mix(vec3(0.05, 0.08, 0.15), vec3(0.2, 0.3, 0.5), rd.y * 0.5 + 0.5);
                                accumulatedLight += rayColor * skyColor;
                                break;
                            }

                            vec3 hitPoint = ro + rd * t;
                            vec3 N = calcNormal(hitPoint);

                            // Material properties
                            vec3 albedo = (matId == 0) ? vec3(0.12, 0.16, 0.23) : uObjColor;
                            float roughness = (matId == 0) ? 0.8 : uObjRoughness;

                            // Direct Shadow Ray to Light Source
                            vec3 lightDir = normalize(uLightPos - hitPoint);
                            float shadow = 1.0;
                            float shadowT = 0.02;
                            int dummy;
                            for(int s = 0; s < 32; s++) {
                                float sd = map(hitPoint + lightDir * shadowT, dummy);
                                if(sd < 0.001) { shadow = 0.0; break; }
                                shadowT += sd;
                                if(shadowT > length(uLightPos - hitPoint)) break;
                            }

                            // Diffuse Lighting + Soft Shadow
                            float NdotL = max(dot(N, lightDir), 0.0);
                            accumulatedLight += rayColor * albedo * uLightColor * NdotL * shadow * 1.5;

                            // Bounce Ray Reflection (Monte Carlo Diffuse Scattering)
                            vec3 randomDir = normalize(vec3(
                                hash(seed + vec2(float(bounce), 0.1)) - 0.5,
                                hash(seed + vec2(float(bounce), 0.2)) - 0.5,
                                hash(seed + vec2(float(bounce), 0.3)) - 0.5
                            ));
                            if(dot(randomDir, N) < 0.0) randomDir = -randomDir;

                            ro = hitPoint + N * 0.002;
                            rd = normalize(mix(reflect(rd, N), randomDir, roughness));
                            rayColor *= albedo;
                        }

                        return accumulatedLight;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        vec2 seed = vUv + vec2(uSampleCount * 0.013);

                        // Generate Ray from Camera Matrix
                        vec3 ro = uCameraPos;
                        vec3 rd = normalize((uCameraMat * vec4(uv, -1.0, 0.0)).xyz);

                        vec3 currentFrameColor = traceRay(ro, rd, seed);

                        // Progressive Accumulation Buffer Averaging
                        vec4 oldColor = texture2D(uPreviousTexture, vUv);
                        if (uSampleCount <= 1.0) {
                            gl_FragColor = vec4(currentFrameColor, 1.0);
                        } else {
                            float weight = 1.0 / uSampleCount;
                            gl_FragColor = vec4(mix(oldColor.rgb, currentFrameColor, weight), 1.0);
                        }
                    }
                `
            });

            ptQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ptMaterial);
            ptScene.add(ptQuad);
        }

        // Raycaster for Touch Selection
        function setupRaycaster() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let touchStartTime = 0;

            renderer.domElement.addEventListener('touchstart', () => { touchStartTime = Date.now(); }, { passive: true });
            renderer.domElement.addEventListener('touchend', (e) => {
                if (Date.now() - touchStartTime > 250) return;

                const touch = e.changedTouches[0];
                mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objects, true);

                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && obj.parent !== scene && !obj.userData.isSelectable) {
                        obj = obj.parent;
                    }
                    selectObject(obj);
                }
            });
        }

        // Selection Logic
        function selectObject(obj) {
            if (!obj || obj.userData.isGround) return;
            selectedObject = obj;
            if (!isPathTracing) transformControls.attach(obj);

            const panel = document.getElementById('inspector-panel');
            panel.classList.remove('hidden');

            const title = document.getElementById('inspector-title');
            const matCtrl = document.getElementById('material-controls');
            const lightCtrl = document.getElementById('light-controls');

            title.innerText = obj.name || "عنصر مجسم";

            if (obj.isLight) {
                matCtrl.classList.add('hidden');
                lightCtrl.classList.remove('hidden');
                document.getElementById('light-color').value = '#' + obj.color.getHexString();
                document.getElementById('light-intensity-val').innerText = obj.intensity.toFixed(1);
            } else {
                matCtrl.classList.remove('hidden');
                lightCtrl.classList.add('hidden');
                if (obj.material) {
                    document.getElementById('obj-color').value = '#' + obj.material.color.getHexString();
                    document.getElementById('obj-color-hex').innerText = '#' + obj.material.color.getHexString();
                }
            }
        }

        function clearSelection() {
            selectedObject = null;
            transformControls.detach();
            document.getElementById('inspector-panel').classList.add('hidden');
        }

        // Toggle Modes (Realtime <-> Real Path Tracing)
        function toggleRenderMode() {
            isPathTracing = !isPathTracing;
            const btn = document.getElementById('render-mode-btn');
            const icon = document.getElementById('render-mode-icon');
            const text = document.getElementById('render-mode-text');
            const ptProgress = document.getElementById('pt-progress-container');

            if (isPathTracing) {
                btn.className = "glass-panel px-4 py-2.5 rounded-full flex items-center gap-2 text-xs font-bold transition-all active:scale-95 border-indigo-500/50 text-indigo-400 shadow-lg shadow-indigo-950/40";
                icon.className = "fa-solid fa-wand-magic-sparkles text-sm";
                text.innerText = "مسار الأشعة (Path Tracing)";
                ptProgress.classList.remove('hidden');
                transformControls.detach();
                resetPathTracing();
            } else {
                btn.className = "glass-panel px-4 py-2.5 rounded-full flex items-center gap-2 text-xs font-bold transition-all active:scale-95 border-emerald-500/50 text-emerald-400 shadow-lg shadow-emerald-950/40";
                icon.className = "fa-solid fa-bolt text-sm";
                text.innerText = "مباشر (Real-time)";
                ptProgress.classList.add('hidden');
                if (selectedObject) transformControls.attach(selectedObject);
            }
        }

        function resetPathTracing() {
            ptSamples = 0;
        }

        // Add Primitive Shapes
        function addPrimitive(type, pos = [0, 0.5, 0]) {
            let geo, mat, mesh;
            mat = new THREE.MeshStandardMaterial({ color: 0x6366f1, roughness: 0.3, metalness: 0.1 });

            switch(type) {
                case 'box': geo = new THREE.BoxGeometry(1, 1, 1); mesh = new THREE.Mesh(geo, mat); mesh.name = "مكعب"; break;
                case 'sphere': geo = new THREE.SphereGeometry(0.6, 32, 32); mesh = new THREE.Mesh(geo, mat); mesh.name = "كرة"; break;
                case 'cylinder': geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); mesh = new THREE.Mesh(geo, mat); mesh.name = "أسطوانة"; break;
                case 'torus': geo = new THREE.TorusGeometry(0.5, 0.2, 16, 100); mesh = new THREE.Mesh(geo, mat); mesh.name = "حلقة"; break;
            }

            mesh.position.set(...pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData.isSelectable = true;

            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh);
            toggleAddMenu(false);

            if (isPathTracing) resetPathTracing();
        }

        // Add Lights
        function addLight(type) {
            let light, helper;

            if (type === 'point') {
                light = new THREE.PointLight(0xf59e0b, 2, 10);
                light.name = "ضوء نقطي";
                helper = new THREE.PointLightHelper(light, 0.3);
            } else if (type === 'sun') {
                light = new THREE.DirectionalLight(0xffffff, 1.5);
                light.name = "ضوء شمسي";
                helper = new THREE.DirectionalLightHelper(light, 0.5);
            } else if (type === 'spot') {
                light = new THREE.SpotLight(0x38bdf8, 3, 12, Math.PI / 6, 0.5);
                light.name = "كشاف";
                helper = new THREE.SpotLightHelper(light);
            }

            light.position.set(2, 4, 2);
            light.castShadow = true;
            light.isLight = true;
            light.userData.isSelectable = true;
            light.userData.helper = helper;

            scene.add(light);
            if (helper) scene.add(helper);

            objects.push(light);
            lights.push(light);
            selectObject(light);
            toggleAddMenu(false);

            if (isPathTracing) resetPathTracing();
        }

        // Import File Models
        function importModel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const filename = file.name.toLowerCase();
            const reader = new FileReader();

            if (filename.endsWith('.gltf') || filename.endsWith('.glb')) {
                reader.readAsArrayBuffer(file);
                reader.onload = function (e) {
                    const loader = new THREE.GLTFLoader();
                    loader.parse(e.target.result, '', (gltf) => {
                        const model = gltf.scene;
                        model.name = file.name.split('.')[0];
                        model.position.set(0, 0, 0);
                        model.userData.isSelectable = true;

                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });

                        scene.add(model);
                        objects.push(model);
                        selectObject(model);
                        toggleAddMenu(false);
                        if (isPathTracing) resetPathTracing();
                    });
                };
            } else if (filename.endsWith('.obj')) {
                reader.readAsText(file);
                reader.onload = function (e) {
                    const loader = new THREE.OBJLoader();
                    const obj = loader.parse(e.target.result);
                    obj.name = file.name.split('.')[0];
                    obj.userData.isSelectable = true;

                    scene.add(obj);
                    objects.push(obj);
                    selectObject(obj);
                    toggleAddMenu(false);
                    if (isPathTracing) resetPathTracing();
                };
            }
        }

        // Inspector Updates
        function updateObjectColor(colorHex) {
            if (selectedObject && selectedObject.material) {
                selectedObject.material.color.set(colorHex);
                document.getElementById('obj-color-hex').innerText = colorHex;
                if (isPathTracing) resetPathTracing();
            }
        }

        function updateMaterialProp(prop, val, displayId) {
            document.getElementById(displayId).innerText = val;
            if (selectedObject && selectedObject.material) {
                selectedObject.material[prop] = parseFloat(val);
                if (isPathTracing) resetPathTracing();
            }
        }

        function updateLightIntensity(val) {
            if (selectedObject && selectedObject.isLight) {
                selectedObject.intensity = parseFloat(val);
                if (isPathTracing) resetPathTracing();
            }
        }

        function updateLightColor(hex) {
            if (selectedObject && selectedObject.isLight) {
                selectedObject.color.set(hex);
                if (isPathTracing) resetPathTracing();
            }
        }

        // Delete Object
        function deleteSelectedObject() {
            if (!selectedObject) return;
            if (selectedObject.userData.helper) scene.remove(selectedObject.userData.helper);
            scene.remove(selectedObject);
            objects = objects.filter(o => o !== selectedObject);
            lights = lights.filter(l => l !== selectedObject);
            clearSelection();
            if (isPathTracing) resetPathTracing();
        }

        // Toggle Add Menu
        function toggleAddMenu(forceState) {
            const menu = document.getElementById('add-menu');
            const icon = document.getElementById('add-btn-icon');
            const isHidden = forceState !== undefined ? !forceState : menu.classList.contains('hidden');

            if (!isHidden) {
                menu.classList.add('hidden');
                icon.className = "fa-solid fa-plus transition-transform duration-300";
            } else {
                menu.classList.remove('hidden');
                icon.className = "fa-solid fa-xmark transition-transform duration-300 rotate-90";
            }
        }

        // Set Gizmo Mode
        function setTransformMode(mode) {
            transformControls.setMode(mode);
            document.querySelectorAll('.transform-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('text-slate-300');
            });
            event.currentTarget.classList.add('bg-indigo-600', 'text-white');
        }

        // Resize Logic
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

            rtTargetA.setSize(window.innerWidth, window.innerHeight);
            rtTargetB.setSize(window.innerWidth, window.innerHeight);
            ptMaterial.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            if (isPathTracing) resetPathTracing();
        }

        // Main Render Loop
        function animate() {
            requestAnimationFrame(animate);

            orbitControls.update();

            lights.forEach(l => {
                if (l.userData.helper) l.userData.helper.update();
            });

            if (isPathTracing) {
                // Execute GPU Path Tracing Shader Engine
                if (ptSamples < maxPtSamples) {
                    ptSamples++;
                    document.getElementById('pt-samples').innerText = `${ptSamples} samples`;

                    // Update GPU Shader Uniforms from Scene State
                    ptMaterial.uniforms.uSampleCount.value = ptSamples;
                    ptMaterial.uniforms.uCameraPos.value.copy(camera.position);
                    ptMaterial.uniforms.uCameraMat.value.copy(camera.matrixWorld);
                    ptMaterial.uniforms.uPreviousTexture.value = renderTargetSource.texture;

                    if (lights.length > 0) {
                        ptMaterial.uniforms.uLightPos.value.copy(lights[0].position);
                        ptMaterial.uniforms.uLightColor.value.copy(lights[0].color);
                    }

                    if (selectedObject && selectedObject.material) {
                        ptMaterial.uniforms.uObjPos.value.copy(selectedObject.position);
                        ptMaterial.uniforms.uObjColor.value.copy(selectedObject.material.color);
                        ptMaterial.uniforms.uObjRoughness.value = selectedObject.material.roughness || 0.3;
                        ptMaterial.uniforms.uObjMetalness.value = selectedObject.material.metalness || 0.1;
                    }

                    // Ping-pong render targets for frame accumulation
                    renderer.setRenderTarget(renderTargetDest);
                    renderer.render(ptScene, ptCamera);
                    renderer.setRenderTarget(null);

                    // Render Path Traced Frame to Screen
                    renderer.render(ptScene, ptCamera);

                    // Swap Buffers
                    let temp = renderTargetSource;
                    renderTargetSource = renderTargetDest;
                    renderTargetDest = temp;
                }
            } else {
                // Realtime WebGL Render
                renderer.render(scene, camera);
            }
        }
    </script>
